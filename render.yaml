# Render Blueprint: creates the PostgreSQL database and the API web service in one go.
# In the Render dashboard: New -> Blueprint -> pick this repository. Values marked
# `sync: false` are asked for during setup (secrets never live in the repo).

databases:
  - name: amrutam-db
    plan: free # Free databases expire after 30 days; use "basic-256mb" or higher for anything lasting
    databaseName: amrutam
    user: amrutam

services:
  - type: web
    name: amrutam-api
    runtime: node
    plan: free # Free instances sleep after 15 min idle (first request is slow, WebSockets drop)
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Migrations run on every deploy before the API starts.
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: amrutam-db
          property: connectionString
      # Frontend origin(s), comma-separated, e.g. https://amrutam.netlify.app
      - key: CORS_ORIGIN
        sync: false
      # Public frontend URL used in email links (usually the same as CORS_ORIGIN)
      - key: APP_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # 64 hex characters: generate with `openssl rand -hex 32`
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: SWAGGER_ENABLED
        value: "false"
      # Payments: leave empty to use the mock provider
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Email: leave SMTP_HOST empty to log emails instead of sending them
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: Amrutam Care <no-reply@amrutam.local>
